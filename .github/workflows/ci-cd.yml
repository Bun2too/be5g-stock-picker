name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/**'
      - 'package*.json'
      - 'netlify.toml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Ensure concurrent runs for the same branch cancel previous runs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend Testing ────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests (FastAPI / Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
          ALPACA_API_KEY: "test-key"
          ALPACA_API_SECRET: "test-secret"
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets/v2"
          ALPACA_PAPER: "true"
          PAPER_TRADING_ENABLED: "false"
          ALPACA_DATA_FEED: "iex"
          ALLOWED_ORIGINS: "http://localhost:5173"
          GUEST_SCREEN_LIMIT: "3"
          GUEST_QUOTA_TTL_SECONDS: "86400"
          GUEST_SESSION_COOKIE_NAME: "stock_picker_guest"
          GUEST_SESSION_COOKIE_SECURE: "false"
          GUEST_SESSION_COOKIE_SAMESITE: "lax"
        run: |
          pytest --tb=short -q

  # ── 2. Frontend Testing ───────────────────────────────────────────────────────
  test-frontend:
    name: 🧪 Frontend Tests (React / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        env:
          VITE_API_BASE_URL: "http://localhost:8000"
          VITE_API_KEY: "test-key"
        run: npm test -- --run

  # ── 3. Frontend Build ─────────────────────────────────────────────────────────
  build-frontend:
    name: 🏗️ Build Frontend Bundle
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN || 'dev-bun2too.us.auth0.com' }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID || 'dibJ5xoVVwNTr3KZU5QfZdFfh2ULLUUT' }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE || 'https://api.be5g.com' }}
          VITE_STRIPE_LEVEL1_CHECKOUT_URL: ${{ secrets.VITE_STRIPE_LEVEL1_CHECKOUT_URL || 'https://buy.stripe.com/dRm6oH2zxduG2Yc8Drds400' }}
          VITE_STRIPE_LEVEL2_CHECKOUT_URL: ${{ secrets.VITE_STRIPE_LEVEL2_CHECKOUT_URL || 'https://buy.stripe.com/bJe9AT1vt62ebuI8Drds401' }}
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/web/dist
          retention-days: 7

  # ── 4a. Deploy Frontend to Netlify ───────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Deploy Frontend (Netlify)
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy \
            --dir=dist \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Deploy from GitHub Commit ${{ github.sha }} ($GITHUB_REF_NAME)"

  # ── 4b. Deploy Backend to Railway ───────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend (Railway)
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Deploy to Railway via CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          npx @railway/cli up \
            --service "$RAILWAY_SERVICE_ID" \
            --detach
