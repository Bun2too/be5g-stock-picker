name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - '.github/workflows/**'
      - 'package*.json'
      - 'netlify.toml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Ensure concurrent runs for the same branch cancel previous runs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend Testing ────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests (FastAPI / Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
          ALPACA_API_KEY: "test-key"
          ALPACA_API_SECRET: "test-secret"
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets/v2"
          ALPACA_PAPER: "true"
          PAPER_TRADING_ENABLED: "false"
          ALPACA_DATA_FEED: "iex"
          ALLOWED_ORIGINS: "http://localhost:5173"
          GUEST_SCREEN_LIMIT: "3"
          GUEST_QUOTA_TTL_SECONDS: "86400"
          GUEST_SESSION_COOKIE_NAME: "stock_picker_guest"
          GUEST_SESSION_COOKIE_SECURE: "false"
          GUEST_SESSION_COOKIE_SAMESITE: "lax"
        run: |
          echo "PWD=$PWD"
          echo "PYTHONPATH=$PYTHONPATH"
          python -c "import sys; print(sys.path[:5]); import app; print(app.__file__)"
          PYTHONPATH="$PWD" python -m pytest --tb=short -q

  # ── 2. Frontend Testing ───────────────────────────────────────────────────────
  test-frontend:
    name: 🧪 Frontend Tests (React / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        env:
          VITE_API_BASE_URL: "http://localhost:8000"
          VITE_API_KEY: "test-key"
        run: npm test -- --run

  # ── 3. Frontend Build ─────────────────────────────────────────────────────────
  build-frontend:
    name: 🏗️ Build Frontend Bundle
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Validate frontend environment
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL is not set in GitHub repository secrets. This workflow builds the Vite bundle before uploading it to Netlify, so Netlify site environment variables are not used for this build."
            exit 1
          fi

          case "$VITE_API_BASE_URL" in
            http://*|https://*)
              ;;
            *)
              echo "::warning::VITE_API_BASE_URL in GitHub repository secrets does not start with http:// or https://. The app will normalize bare hostnames to https:// at runtime, but the GitHub secret should still be corrected."
              ;;
          esac

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN || 'dev-bun2too.us.auth0.com' }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID || 'dibJ5xoVVwNTr3KZU5QfZdFfh2ULLUUT' }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE || 'https://api.be5g.com' }}
          VITE_STRIPE_LEVEL1_CHECKOUT_URL: ${{ secrets.VITE_STRIPE_LEVEL1_CHECKOUT_URL || 'https://buy.stripe.com/dRm6oH2zxduG2Yc8Drds400' }}
          VITE_STRIPE_LEVEL2_CHECKOUT_URL: ${{ secrets.VITE_STRIPE_LEVEL2_CHECKOUT_URL || 'https://buy.stripe.com/bJe9AT1vt62ebuI8Drds401' }}
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/web/dist
          retention-days: 7

  # ── 4a. Deploy Frontend to Netlify ───────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Deploy Frontend (Netlify)
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: dist

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set. Add a Netlify personal access token that has access to the target site."
            exit 1
          fi

          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is not set. Add the Netlify Project ID from Project configuration > General > Project details."
            exit 1
          fi

          npx netlify-cli@17.38.1 status \
            --auth="$NETLIFY_AUTH_TOKEN"

          npx netlify-cli@17.38.1 deploy \
            --dir=dist \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Deploy from GitHub Commit ${{ github.sha }} ($GITHUB_REF_NAME)"

  # ── 4b. Deploy Backend to Railway ───────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend (Railway)
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Deploy to Railway via CLI
        env:
          SECRET_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SECRET_RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_ENVIRONMENT_NAME: ${{ secrets.RAILWAY_ENVIRONMENT_NAME || 'production' }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::error::RAILWAY_SERVICE_ID is not set. Add it under GitHub repository secrets."
            exit 1
          fi

          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::RAILWAY_PROJECT_ID is not set. Add the Railway Project ID under GitHub repository secrets."
            exit 1
          fi

          railway_environment="${RAILWAY_ENVIRONMENT_ID:-$RAILWAY_ENVIRONMENT_NAME}"
          if [ -z "$railway_environment" ]; then
            echo "::error::RAILWAY_ENVIRONMENT_ID or RAILWAY_ENVIRONMENT_NAME is required."
            exit 1
          fi

          if [ -n "$SECRET_RAILWAY_TOKEN" ]; then
            export RAILWAY_TOKEN="$SECRET_RAILWAY_TOKEN"
            echo "Using project-scoped RAILWAY_TOKEN."
            railway_auth_kind="project"
          elif [ -n "$SECRET_RAILWAY_API_TOKEN" ]; then
            export RAILWAY_API_TOKEN="$SECRET_RAILWAY_API_TOKEN"
            echo "Using account/workspace-scoped RAILWAY_API_TOKEN."
            railway_auth_kind="account"
          else
            echo "::error::No Railway token configured. Add RAILWAY_TOKEN from Railway project settings, or RAILWAY_API_TOKEN from Railway account/workspace tokens."
            exit 1
          fi

          if [ "$railway_auth_kind" = "account" ]; then
            npx @railway/cli@5.41.2 whoami
          fi

          echo "Deploying Railway project=$RAILWAY_PROJECT_ID environment=$railway_environment service=$RAILWAY_SERVICE_ID"
          npx @railway/cli@5.41.2 up \
            apps/api \
            --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$railway_environment" \
            --service "$RAILWAY_SERVICE_ID" \
            --detach
