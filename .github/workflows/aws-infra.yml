name: AWS Infra

on:
  push:
    branches:
      - main
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-infra.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/aws/**"
      - ".github/workflows/aws-infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check AWS authentication configuration
        run: |
          if [ -n "$AWS_ROLE_TO_ASSUME" ]; then
            echo "Using GitHub OIDC role: $AWS_ROLE_TO_ASSUME"
          elif [ -n "$AWS_ACCESS_KEY_ID_SECRET" ] && [ -n "$AWS_SECRET_ACCESS_KEY_SECRET" ]; then
            echo "Using static AWS credentials for bootstrap/deploy."
          else
            echo "::error::AWS credentials are not configured. Set AWS_ROLE_TO_ASSUME for OIDC, or set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY for initial bootstrap."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: stock-picker-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials via static keys
        if: env.AWS_ROLE_TO_ASSUME == '' && env.AWS_ACCESS_KEY_ID_SECRET != '' && env.AWS_SECRET_ACCESS_KEY_SECRET != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID_SECRET }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS caller identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.8.5

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
