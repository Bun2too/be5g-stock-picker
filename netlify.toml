# ─────────────────────────────────────────────────────────────────────────────
# Netlify build configuration for be5g stock-picker (frontend only)
#
# Environment variables to set in Netlify → Site settings → Environment:
#   VITE_API_BASE_URL        → https://your-railway-api-url.railway.app
#   VITE_API_KEY             → matching API_KEY from Railway env
#   VITE_AUTH0_DOMAIN        → dev-bun2too.us.auth0.com
#   VITE_AUTH0_CLIENT_ID     → your Auth0 client ID
#   VITE_AUTH0_AUDIENCE      → https://api.be5g.com
# ─────────────────────────────────────────────────────────────────────────────

[build]
  base    = "apps/web"
  command = "npm run build"
  publish = "dist"

# SPA fallback — all routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options             = "DENY"
    X-Content-Type-Options      = "nosniff"
    X-XSS-Protection            = "1; mode=block"
    Referrer-Policy             = "strict-origin-when-cross-origin"
    Permissions-Policy          = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security   = "max-age=31536000; includeSubDomains; preload"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
